name: Deploy Production

on:
  workflow_dispatch: # Manual trigger to ensure controlled production releases

concurrency:
  group: deploy-production
  cancel-in-progress: false # Production deployments should not be interrupted

jobs:
  # Quality gate: reuse CI workflow (type-check, lint, tests, and migration replay) before deploying
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "🔨 Building Docker image chinese-divination:latest for production..."
          docker build --network=host -t chinese-divination:latest .

      - name: Deploy Production Container
        run: |
          echo "🛑 Stopping and cleaning up previous production container..."
          docker stop chinese-divination || true
          docker rm chinese-divination || true

          # Load production environment variables from PROD_ENV_FILE_PATH or fallback candidates
          ENV_FILE_FLAG=""
          TARGET_ENV_FILE="${PROD_ENV_FILE_PATH:-$HOME/.env.chinese-divination-production}"
          if [ -n "${TARGET_ENV_FILE}" ] && [ -f "${TARGET_ENV_FILE}" ]; then
            echo "📄 Using production environment file: ${TARGET_ENV_FILE}"
            ENV_FILE_FLAG="--env-file ${TARGET_ENV_FILE}"
          elif [ -f .env.production ]; then
            echo "📄 Using .env.production"
            ENV_FILE_FLAG="--env-file .env.production"
          else
            echo "❌ Error: Production environment file not found at ${TARGET_ENV_FILE} or .env.production!"
            exit 1
          fi

          echo "🚀 Running new production container: chinese-divination..."
          # Configuration notes:
          # - --network host: Direct host networking to access local PostgreSQL (127.0.0.1:5432) and port 8094
          # - --memory 2g: Enforce container memory ceiling
          # - -e PORT=8094: Bind production reverse-proxy target port 8094
          docker run -d \
            --name chinese-divination \
            --restart unless-stopped \
            --memory 2g \
            --network host \
            $ENV_FILE_FLAG \
            -e HOSTNAME=0.0.0.0 \
            -e NODE_ENV=production \
            -e PORT=8094 \
            --health-cmd "wget -q -O /dev/null http://127.0.0.1:\${PORT:-8094}/api/config/nav || exit 1" \
            --health-interval 30s \
            --health-timeout 10s \
            --health-retries 3 \
            --health-start-period 90s \
            chinese-divination:latest

      - name: Verify Production Health
        run: |
          echo "⏳ Waiting for production container startup and database migrations..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Status}}' chinese-divination 2>/dev/null || echo "not_found")
            RESTART_COUNT=$(docker inspect --format '{{.RestartCount}}' chinese-divination 2>/dev/null || echo "0")

            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$RESTART_COUNT" -gt 0 ]; then
              echo "❌ Production container crashed during startup! (Status: $STATUS, RestartCount: $RESTART_COUNT)"
              docker logs --tail 50 chinese-divination
              exit 1
            fi

            # Probe health check endpoint on production port 8094
            if docker exec chinese-divination wget -q -O /dev/null http://127.0.0.1:8094/api/config/nav 2>/dev/null; then
              echo "✅ Production application is healthy and ready on port 8094!"
              docker ps --filter "name=chinese-divination"
              exit 0
            fi

            echo "Waiting for production service to be healthy (attempt $i/30)..."
            sleep 2
          done

          echo "❌ Health check timed out after 60s. Production container failed to become healthy:"
          docker logs --tail 50 chinese-divination
          exit 1

      - name: Prune Dangling Images
        if: always()
        run: |
          docker image prune -f
