name: CI

on:
  push:
    branches-ignore:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_call: # lets deploy-local.yml depend on this workflow

# Cancel superseded runs on the same branch/PR — quick successive pushes
# otherwise pile up parallel Postgres containers on the runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: divination_test
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:55432/divination_test
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Replays ALL migrations against a fresh Postgres — catches broken or
      # drifting migration files before they ever reach a real database.
      - run: npx prisma migrate deploy
      - run: npm run type-check
      - run: npm run lint
      - name: Unit Tests
        run: npm run test:unit
      # Integration tests — runs against the fresh Postgres service container
      - name: Integration Tests (DB-backed)
        run: npm run test:integration
      # Production build gate — prerender/RSC-boundary/bundling errors only
      # surface at `next build`, never at type-check or lint.
      - name: Production Build
        run: npm run build
