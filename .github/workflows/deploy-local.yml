name: Local Docker Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual dispatch

# Prevent concurrent staging deployments from colliding on ports and container names
concurrency:
  group: deploy-local
  cancel-in-progress: true

jobs:
  # Quality gate: reuse CI workflow (type-check, lint, tests, and migration replay) before deploying
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "🔨 Building Docker image chinese-divination:latest..."
          docker build --network=host -t chinese-divination:latest .

      - name: Deploy Container
        run: |
          echo "🛑 Stopping and cleaning up previous container instance..."
          docker stop chinese-divination-test || true
          docker rm chinese-divination-test || true

          # Load staging environment variables from TEST_ENV_FILE_PATH or fallback candidates
          ENV_FILE_FLAG=""
          TARGET_ENV_FILE="${TEST_ENV_FILE_PATH:-$HOME/.env.chinese-divination-test}"
          if [ -n "${TARGET_ENV_FILE}" ] && [ -f "${TARGET_ENV_FILE}" ]; then
            echo "📄 Using staging environment file: ${TARGET_ENV_FILE}"
            ENV_FILE_FLAG="--env-file ${TARGET_ENV_FILE}"
          elif [ -f .env.production ]; then
            echo "📄 Using .env.production"
            ENV_FILE_FLAG="--env-file .env.production"
          elif [ -f .env ]; then
            echo "📄 Using .env"
            ENV_FILE_FLAG="--env-file .env"
          else
            echo "⚠️ Warning: No staging environment file found at ${TARGET_ENV_FILE}, .env.production, or .env!"
          fi

          echo "🚀 Running new container: chinese-divination-test..."
          # Configuration notes:
          # - --network host: Direct host networking to access local PostgreSQL (127.0.0.1:5432) and staging port 8088
          # - --memory 2g: Enforce container memory ceiling
          # - -e PORT=8088: Bind staging port 8088
          # - --health-*: Health check policy with 90s startup grace period
          docker run -d \
            --name chinese-divination-test \
            --restart unless-stopped \
            --memory 2g \
            --network host \
            $ENV_FILE_FLAG \
            -e HOSTNAME=0.0.0.0 \
            -e NODE_ENV=production \
            -e PORT=8088 \
            --health-cmd "wget -q -O /dev/null http://127.0.0.1:\${PORT:-8088}/api/config/nav || exit 1" \
            --health-interval 30s \
            --health-timeout 10s \
            --health-retries 3 \
            --health-start-period 90s \
            chinese-divination:latest

      - name: Verify Deployment Health
        run: |
          echo "⏳ Waiting for container startup and database migrations..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Status}}' chinese-divination-test 2>/dev/null || echo "not_found")
            RESTART_COUNT=$(docker inspect --format '{{.RestartCount}}' chinese-divination-test 2>/dev/null || echo "0")

            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$RESTART_COUNT" -gt 0 ]; then
              echo "❌ Container crashed during startup! (Status: $STATUS, RestartCount: $RESTART_COUNT)"
              docker logs --tail 50 chinese-divination-test
              exit 1
            fi

            # Probe health check endpoint on staging port 8088
            if docker exec chinese-divination-test wget -q -O /dev/null http://127.0.0.1:8088/api/config/nav 2>/dev/null; then
              echo "✅ Application is healthy and ready on port 8088!"
              docker ps --filter "name=chinese-divination-test"
              exit 0
            fi

            echo "Waiting for service to be healthy (attempt $i/30)..."
            sleep 2
          done

          echo "❌ Health check timed out after 60s. Container failed to become healthy:"
          docker logs --tail 50 chinese-divination-test
          exit 1

      - name: Prune Dangling Images
        if: always()
        run: |
          docker image prune -f
