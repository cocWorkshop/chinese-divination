name: Local Docker Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持手动触发

# 避免并发部署造成端口与容器冲突
concurrency:
  group: deploy-local
  cancel-in-progress: true

jobs:
  # 质量门禁：复用 CI 工作流，确保类型检查、lint、测试及数据库迁移回放通过后再部署（源自 docker-publish.yml）
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "🔨 Building Docker image chinese-divination:latest..."
          docker build -t chinese-divination:latest .

      - name: Deploy Container
        run: |
          echo "🛑 Stopping and cleaning up previous container instance..."
          docker stop chinese-divination-test || true
          docker rm chinese-divination-test || true

          # 加载环境变量文件（优先使用 .env.production，回退至 .env）
          ENV_FILE_FLAG=""
          if [ -f .env.production ]; then
            echo "📄 Using .env.production"
            ENV_FILE_FLAG="--env-file .env.production"
          elif [ -f .env ]; then
            echo "📄 Using .env"
            ENV_FILE_FLAG="--env-file .env"
          else
            echo "⚠️ Warning: No .env.production or .env file found!"
          fi

          echo "🚀 Running new container: chinese-divination-test..."
          # 配置说明（继承自 docker-compose.yml）：
          # - --network host: 直连宿主机网络，确保容器可访问宿主机 PostgreSQL (localhost:5432)
          # - --memory 2g: 限制内存防止内存泄漏导致宿主机故障
          # - -e PORT=8088: 监听本地 8088 测试端口
          # - --health-*: 继承 compose 的健康检查策略与 90s 启动缓冲
          docker run -d \
            --name chinese-divination-test \
            --restart unless-stopped \
            --memory 2g \
            --network host \
            $ENV_FILE_FLAG \
            -e HOSTNAME=0.0.0.0 \
            -e NODE_ENV=production \
            -e PORT=8088 \
            --health-cmd "wget -q -O /dev/null http://127.0.0.1:\${PORT:-8088}/api/config/nav || exit 1" \
            --health-interval 30s \
            --health-timeout 10s \
            --health-retries 3 \
            --health-start-period 90s \
            chinese-divination:latest

      - name: Verify Deployment Health
        run: |
          echo "⏳ Waiting for container startup and database migrations..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format '{{.State.Status}}' chinese-divination-test 2>/dev/null || echo "not_found")
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              echo "❌ Container crashed during startup! Showing recent logs:"
              docker logs --tail 50 chinese-divination-test
              exit 1
            fi

            # 探测健康检查端点
            if docker exec chinese-divination-test wget -q -O /dev/null http://127.0.0.1:8088/api/config/nav 2>/dev/null; then
              echo "✅ Application is healthy and ready on port 8088!"
              docker ps --filter "name=chinese-divination-test"
              exit 0
            fi

            echo "Waiting for service to be healthy (attempt $i/15)..."
            sleep 2
          done

          echo "⚠️ Health check timed out after 30s. Checking container status & logs:"
          docker logs --tail 30 chinese-divination-test

      - name: Prune Dangling Images
        if: always()
        run: |
          docker image prune -f