services:
  chinese-divination:
    image: ghcr.io/zw3413/chinese-divination:latest
    container_name: chinese-divination
    network_mode: host
    env_file:
      - .env.production
    environment:
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped
    # Cap memory so a leak degrades to a restart instead of taking the host down.
    # Node's default heap limit (~1.7GB) sits comfortably under this.
    mem_limit: 2g
    # Detect a hung process (the app serves 600s LLM requests — a wedged event
    # loop otherwise looks identical to "busy"). /api/config/nav is a cheap
    # public GET. start_period covers prisma migrate deploy on boot.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-3000}/api/config/nav || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
