              - paragraph [ref=e270]: The year pillar 乙未 suggests early family conditions that were decent in values but not necessarily easy in emotional comfort. There is softness, culture, and perhaps thrift in the family background, but also a sense that duty came early. The day pillar 癸卯 gives sensitivity, human feeling, and an inner preference for harmony, while the many noble stars such as 天乙贵人, 文昌贵人, 国印贵人, and 将星 show that he has help in critical moments, a good mind, and the capacity to earn respect rather than merely demand it.
