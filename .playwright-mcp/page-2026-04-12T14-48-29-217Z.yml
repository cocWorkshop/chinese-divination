      - heading "隱私政策" [level=1] [ref=e19]
      - paragraph [ref=e20]: 版本 1.1 · 生效日期：2026-04-11
      - generic [ref=e21]:
        - generic [ref=e22]:
          - heading "1. 簡介" [level=2] [ref=e23]
          - paragraph [ref=e24]: 玄機（以下簡稱「本平台」）致力於保護您的個人隱私。本隱私政策說明我們如何收集、使用、存儲和保護您的個人資料。本平台遵守《歐盟通用數據保護條例》（GDPR）以及《加拿大個人信息保護和電子文件法》（PIPEDA）。
        - generic [ref=e25]:
          - heading "2. 收集的數據" [level=2] [ref=e26]
          - list [ref=e27]:
            - listitem [ref=e28]: 帳號信息：電子郵箱、姓名（可選）、密碼（加密存儲）
            - listitem [ref=e29]: 出生信息：出生日期、時辰、出生地、性別 — 用於占卜計算
            - listitem [ref=e30]: 占卜記錄：您的問題和生成的解讀結果
            - listitem [ref=e31]: 玄機大師對話歷史：你的訊息、AI 回覆、相關工具呼叫記錄
            - listitem [ref=e32]: 用戶記憶：從對話中自動提取的穩定偏好和興趣（可隨時關閉、刪除、匯出）
            - listitem [ref=e33]: 使用日誌：IP 地址、用戶代理（User Agent）、登入/登出時間 — 用於安全審計
            - listitem [ref=e34]: 回饋信息：您提交的評分和意見回饋
        - generic [ref=e35]:
          - heading "2a. 玄機大師對話與記憶" [level=2] [ref=e36]
          - paragraph [ref=e37]: 為了提供個人化的占卜諮詢體驗，玄機大師 AI 助手會：
          - list [ref=e38]:
            - listitem [ref=e39]: 記錄你與大師的對話內容（用戶訊息、AI 回覆、工具呼叫記錄），存儲於本平台資料庫
            - listitem [ref=e40]: 自動從對話中提取穩定的用戶偏好和興趣（「用戶記憶」），用於為你定制更貼近的回應
            - listitem [ref=e41]: 在每次對話中將你的「用戶記憶」作為上下文發送給第三方 AI 模型
          - paragraph [ref=e42]:
            - strong [ref=e43]: 用戶記憶中包含：
            - text: 你經常關心的主題、溝通偏好、穩定的生活背景描述。
          - paragraph [ref=e44]:
            - strong [ref=e45]: 用戶記憶中不包含：
            - text: 臨時情緒、一次性問題、詳細的命盤資料（命盤資料另存於占卜歷史）。
          - paragraph [ref=e46]:
            - strong [ref=e47]: 你的控制權：
          - list [ref=e48]:
            - listitem [ref=e49]: 在「個人資料 → 玄機大師記憶」頁面查看、編輯、刪除你的用戶記憶
            - listitem [ref=e50]: 隨時暫停或永久關閉記憶功能
            - listitem [ref=e51]: 在資料匯出（GDPR）中包含完整的對話歷史和用戶記憶
            - listitem [ref=e52]: 刪除帳號時，所有對話和記憶將一併永久清除
          - paragraph [ref=e53]:
            - strong [ref=e54]: 管理員存取：
            - text: 為了支援與除錯，授權管理員可在個別情況下存取你的記憶資料。每次存取都會記錄到審計日誌（管理員 ID、目標用戶 ID、操作類型、時間），這些日誌可透過資料匯出取得。一般管理員介面不會顯示用戶記憶。
          - paragraph [ref=e55]: 此功能預設開啟。如果你不希望使用，請在「個人資料 → 玄機大師記憶」頁面關閉。
        - generic [ref=e56]:
          - heading "3. 數據用途" [level=2] [ref=e57]
          - list [ref=e58]:
            - listitem [ref=e59]: 提供占卜服務：您的出生信息和問題將發送至第三方 AI 模型進行分析和解讀
            - listitem [ref=e60]: 帳號管理：身份驗證、密碼重置
            - listitem [ref=e61]: 安全保障：防止未授權訪問、檢測異常行為
            - listitem [ref=e62]: 服務改進：匿名統計分析
        - generic [ref=e63]:
          - heading "4. 第三方數據處理" [level=2] [ref=e64]
          - paragraph [ref=e65]: 為了提供占卜解讀服務，您的出生信息和問題會被發送至以下第三方 AI 服務提供商進行處理：
          - list [ref=e66]:
            - listitem [ref=e67]:
              - strong [ref=e68]: Google Cloud AI
              - text: — 隱私聲明：
              - link "cloud.google.com/terms/cloud-privacy-notice" [ref=e69] [cursor=pointer]:
                - /url: https://cloud.google.com/terms/cloud-privacy-notice
            - listitem [ref=e70]:
              - strong [ref=e71]: Amazon Web Services (AWS)
              - text: — 隱私聲明：
              - link "aws.amazon.com/privacy" [ref=e72] [cursor=pointer]:
                - /url: https://aws.amazon.com/privacy/
          - generic [ref=e73]:
            - paragraph [ref=e74]: 🔒 數據安全承諾
            - paragraph [ref=e75]: 我們使用的所有 AI 模型均為商業版本，明確承諾不使用用戶數據進行模型訓練（No Data Training）。您的占卜數據不會被用於改善或訓練 AI 模型。
        - generic [ref=e76]:
          - heading "5. 數據加密" [level=2] [ref=e77]
          - list [ref=e78]:
            - listitem [ref=e79]: 傳輸加密：所有數據傳輸均使用 HTTPS/TLS 加密協議
            - listitem [ref=e80]: 存儲加密：用戶密碼使用 bcrypt 算法進行哈希加密存儲；數據庫採用加密存儲
            - listitem [ref=e81]: 第三方傳輸：與 AI 服務提供商之間的數據傳輸同樣使用 TLS 加密
        - generic [ref=e82]:
          - heading "6. 數據存儲" [level=2] [ref=e83]
          - list [ref=e84]:
            - listitem [ref=e85]: 存儲位置：加拿大
            - listitem [ref=e86]: 帳號數據：在帳號存續期間保留
            - listitem [ref=e87]: 玄機大師對話與記憶：在帳號存續期間保留，可隨時手動清除
            - listitem [ref=e88]: 安全日誌（IP、登入記錄）：保留 90 天後自動清除
            - listitem [ref=e89]: LLM 調用日誌：保留 180 天後自動清除
            - listitem [ref=e90]: 帳號刪除後：所有數據將在 30 天內徹底清除
        - generic [ref=e91]:
          - heading "7. 您的權利" [level=2] [ref=e92]
          - paragraph [ref=e93]: 根據 GDPR 和 PIPEDA，您擁有以下權利：
          - list [ref=e94]:
            - listitem [ref=e95]: 訪問權：查看和導出您的所有個人數據
            - listitem [ref=e96]: 更正權：修改不準確的個人信息
            - listitem [ref=e97]: 刪除權：刪除您的帳號和所有相關數據
            - listitem [ref=e98]: 數據可攜權：以機器可讀格式導出您的數據
            - listitem [ref=e99]: 記憶查看與控制：查看、編輯、暫停或刪除玄機大師的用戶記憶（在「個人資料 → 玄機大師記憶」頁面）
          - paragraph [ref=e100]: 您可以在「個人資料」頁面中行使以上權利（導出數據、刪除帳號）。
        - generic [ref=e101]:
          - heading "8. Cookie 使用" [level=2] [ref=e102]
          - paragraph [ref=e103]: 本平台僅使用必要的會話 Cookie（NextAuth JWT）用於維持您的登入狀態。我們不使用第三方追蹤 Cookie 或廣告 Cookie。
        - generic [ref=e104]:
          - heading "9. 數據洩露通知" [level=2] [ref=e105]
          - paragraph [ref=e106]: 如發生數據洩露事件，我們將在 72 小時內（符合 GDPR 要求）通過電子郵件通知受影響的用戶，並向相關監管機構報告。
        - generic [ref=e107]:
          - heading "10. 未成年人保護" [level=2] [ref=e108]
          - paragraph [ref=e109]: 本平台不面向 16 歲以下的未成年人。如果我們發現收集了未成年人的數據，將立即刪除。
        - generic [ref=e110]:
          - heading "11. 政策更新" [level=2] [ref=e111]
          - paragraph [ref=e112]: 本隱私政策可能會不定期更新。更新後，我們將在您下次登入時提示您查閱並同意新版本。
        - generic [ref=e113]:
          - heading "12. 聯繫我們" [level=2] [ref=e114]
          - paragraph [ref=e115]: 如有任何隱私相關問題或數據請求，請通過以下方式聯繫我們：
          - paragraph [ref=e116]: 📧 admin@chinese-divination.com
