<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer circle: dark background -->
  <circle cx="50" cy="50" r="48" fill="#0a0f1e" stroke="#d4a853" stroke-width="2"/>
  <!-- Gold half (right/upper fish body) -->
  <path d="M50 2a48 48 0 0 1 0 96a24 24 0 0 1 0-48a24 24 0 0 0 0-48z" fill="#d4a853"/>

  <!-- Eye on the GOLD half (upper, center y=26): dark fill + gold pupil -->
  <circle cx="50" cy="26" r="8" fill="#0a0f1e"/>
  <circle cx="50" cy="26" r="4" fill="#d4a853"/>

  <!-- Eye on the DARK half (lower, center y=74): gold fill + dark pupil -->
  <circle cx="50" cy="74" r="8" fill="#d4a853"/>
  <circle cx="50" cy="74" r="4" fill="#0a0f1e"/>
</svg>
